name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned to v2.11.x — v2.12.1 introduced regressions in
          # //nolint:gocritic suppression handling and ruleguard
          # function-body matching that break TestRuleguardRules.
          # Unpin once upstream fixes are released.
          version: v2.11.1
          args: -v ./...

      - name: CI
        run: make ci SKIP_LINT=1

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.out

      # Gabriel benchmarks produce a trend-analysis CSV artifact and have no
      # pass/fail signal that should gate a merge. Running them on every PR
      # adds ~95s of wall-clock with no gating value, so they're restricted
      # to master-push runs — same pattern as the Codecov upload above.
      - name: Benchmark (Gabriel suite)
        if: github.event_name == 'push'
        run: |
          cd examples/benchmarks
          SCHEME=../../dist/linux/amd64/wile RUNS=3 ./run-canonical.sh

      # `always()` preserves the original intent of uploading partial results
      # even if the benchmark step crashed; combined with the push gate so
      # the step is skipped entirely on PR runs (where no CSVs exist).
      - name: Upload benchmark results
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: examples/benchmarks/canonical-results-*.csv
          retention-days: 90
