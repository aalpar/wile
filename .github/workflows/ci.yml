# The merge gate: lint, build-all, the full test suite, coverage, docs and
# examples, via `make ci`.
#
# The race detector is deliberately NOT here. It lives in race.yml, which runs
# nightly and on demand rather than per merge. `make ci` does not build with
# -race, so a green run of this workflow says nothing about data races - see
# race.yml for what does, and for why it was taken out of the gate.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          # v2.11.1 cannot lint a go1.27 tree at all: it pins
          # golang.org/x/tools v0.42.0, whose importer caps at export-data
          # version 2 while go1.27 emits version 4, so every run panics with
          # "package requires newer Go version go1.27". Rebuilding it under
          # go1.27 does not help — the cap is in the pinned dependency.
          #
          # v2.13.1 pins x/tools v0.49.0 and reads go1.27 export data. It also
          # clears the v2.12.1 regressions this pin originally guarded against:
          # TestRuleguardRules passes, and no gocritic finding escapes its
          # //nolint suppression.
          version: v2.13.1
          args: -v ./...

      - name: CI
        run: make ci SKIP_LINT=1

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.out

      # Gabriel benchmarks produce a trend-analysis CSV artifact and have no
      # pass/fail signal that should gate a merge. Running them on every PR
      # adds ~95s of wall-clock with no gating value, so they're restricted
      # to master-push runs — same pattern as the Codecov upload above.
      - name: Benchmark (Gabriel suite)
        if: github.event_name == 'push'
        run: |
          cd examples/benchmarks
          SCHEME=../../dist/linux/amd64/wile RUNS=3 ./run-canonical.sh

      # `always()` preserves the original intent of uploading partial results
      # even if the benchmark step crashed; combined with the push gate so
      # the step is skipped entirely on PR runs (where no CSVs exist).
      - name: Upload benchmark results
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ github.sha }}
          path: examples/benchmarks/canonical-results-*.csv
          retention-days: 90
